name: Supabase Keep-Alive Heartbeat

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API Endpoint
        run: |
          echo "Triggering daily Supabase keep-alive ping..."
          curl -sS -X GET "https://lambodarautsav.vercel.app/api/cron/keepalive" || true
          echo "Heartbeat ping completed successfully!"
